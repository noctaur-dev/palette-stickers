name: Build APK

# Every push to main builds a signed APK and publishes it as the "latest" release, so the
# newest build is always at:  https://github.com/<you>/<repo>/releases/latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; just make sure licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PaletteStickers-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PaletteStickers-apk
          path: out/*.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "Palette Stickers 1.0.${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download the .apk on your phone and open it to install or update." \
            --latest
