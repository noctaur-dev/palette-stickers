name: Build APK

# Every push to main:
#  • builds "Peelbox Dev" (unlimited, shared dev key) and publishes it as the public "latest" release
#  • if the signing secrets are set, also builds the signed Galaxy Store APK, uploaded only as a
#    private workflow artifact (never to the public release page)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      iap_test:
        description: "Store build uses Samsung IAP test mode (free purchases for Seller Portal testers)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_STORE_KEY: ${{ secrets.PEELBOX_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; just make sure licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Peelbox Dev
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed store APK
        if: env.HAS_STORE_KEY == 'true'
        env:
          PEELBOX_KEYSTORE_B64: ${{ secrets.PEELBOX_KEYSTORE_B64 }}
          PEELBOX_KEYSTORE_PASSWORD: ${{ secrets.PEELBOX_KEYSTORE_PASSWORD }}
          IAP_TEST: ${{ inputs.iap_test && 'true' || 'false' }}
        run: |
          echo "$PEELBOX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/peelbox.jks"
          export PEELBOX_KEYSTORE_PATH="$RUNNER_TEMP/peelbox.jks"
          gradle :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/peelbox.jks"

      - name: Collect APKs
        run: |
          mkdir -p out store
          cp app/build/outputs/apk/debug/app-debug.apk "out/PeelboxDev-1.1.${{ github.run_number }}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            suffix=""; [ "${{ inputs.iap_test }}" = "true" ] && suffix="-iaptest"
            cp app/build/outputs/apk/release/app-release.apk "store/Peelbox-1.1.${{ github.run_number }}$suffix.apk"
          fi

      - uses: actions/upload-artifact@v4
        if: env.HAS_STORE_KEY == 'true'
        with:
          name: Peelbox-store-apk
          path: store/*.apk

      - name: Publish dev build as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "Peelbox Dev 1.1.${{ github.run_number }}" \
            --notes "Dev build from ${GITHUB_SHA::7} (unlimited packs, installs alongside the store version). Download the .apk on your phone and open it to install or update." \
            --latest
